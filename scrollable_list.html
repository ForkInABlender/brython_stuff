This approach uses brython.js to create a vertical scrollbar, instead of a horizontal one.

-->
<!DOCTYPE html>
<html>
<head>
    <title>Horizontally Scrollable Section with Brython</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.9.5/brython.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        .scrollable-container {
            width: 480px;
            height: 170px;
            overflow-x: scroll;
            overflow-y: hidden;
            white-space: nowrap;
            padding: 5px;
            background-color: #fff;
            justify-content: center;
            align-items: center;
        }
        .item {
            margin-top: 5px;
            display: inline-block;
            width: 150px;
            height: 150px;
            margin-right: 5px;
            margin-left: 5px;
            background-color: #f0f0f0;
            text-align: center;
            line-height: 150px;
            border: 1px solid #aaa;
        }
        /* Custom scroll bar */
        .scrollable-container::-webkit-scrollbar {
            height: 8px; /* Scrollbar height */
        }
        .scrollable-container::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .scrollable-container::-webkit-scrollbar-thumb {
            background: #888; 
        }
        .scrollable-container::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }
    </style>
</head>
<body onload="brython()">

<div class="scrollable-container" id="scrollable-container">
    <!-- Content will be added by Brython -->
</div>

<script type="text/python3">
from browser import document, html

# Select the scrollable container
scrollable_container = document['scrollable-container']

# Add content to the scrollable container
for i in range(0, 5):
    item = html.DIV(f"Item {i+1}", Class="item")
    scrollable_container <= item
</script>

</body>
</html>
